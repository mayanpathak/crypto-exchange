[package]
name = "api"
version = "0.1.0"
edition = "2024"


[dependencies]
# Web Framework
axum = "0.8"
tokio = { version = "1.52", features = ["full"] }

# Logging
log = "0.4"
env_logger = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Validation
validator = { version = "0.20.0", features = ["derive"] }

# Database
database = { path = "../database" }
diesel = { version = "2.2.7", features = ["postgres", "r2d2"] }
mongodb = "2.8"

# Authentication
bcrypt = "0.15"
jsonwebtoken = "9.2"

# Time
chrono = { version = "0.4.39", features = ["serde"] }
time = "0.3"

# UUIDs
uuid = { version = "1", features = ["v4", "serde"] }

# Environment Variables
dotenvy = "0.15"

# HTTP Middleware
tower-http = { version = "0.6", features = ["cors", "fs"] }
axum-extra = { version = "0.12", features = ["cookie"] }

# Redis
redis = { version = "0.29.0", features = ["tokio-comp"] }
deadpool-redis = "0.14"

# Utilities
once_cell = "1.8"
rand = "0.8"

# Async Utilities
futures = "0.3.31"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Email
lettre = { version = "0.11", features = ["smtp-transport", "builder"] }